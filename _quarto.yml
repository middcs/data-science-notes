project:
  type: book
  output-dir: docs
  

book: 
  title: "Applied Data Science"
  author: "Michael Linderman and Phil Chodrow"
  date: "01/05/2026"
  license: "CC BY-NC 4.0"
  page-footer:
    center:
      - text: "&#169; Michael Linderman, Phil Chodrow, 2025-2026. Openly licensed via CC BY-NC 4.0. <img src='https://mirrors.creativecommons.org/presskit/icons/cc.svg' alt='' style='max-width: 1em;max-height:1em;margin-left: .2em;'><img src='https://mirrors.creativecommons.org/presskit/icons/by.svg' alt='' style='max-width: 1em;max-height:1em;margin-left: .2em;'><img src='https://mirrors.creativecommons.org/presskit/icons/nc.svg' alt='' style='max-width: 1em;max-height:1em;margin-left: .2em;'>"
        href: https://creativecommons.org/licenses/by-nc/4.0/
  sidebar: 
    search: false
  chapters:
    - index.qmd
    - part: "Data Wrangling and Exploration"
      chapters: 
        - source/10-intro-python-datascience.qmd
        - source/11-pandas-data-wrangling.qmd
        - source/12-visualization.qmd
        - source/13-data-wrangling.qmd
    - part: "Machine Learning and Prediction"
      chapters:
        - source/20-introduction-prediction.qmd
        - source/21-feature-engineering-and-overfitting.qmd
        - source/25-classification.qmd
        - source/26-compas.qmd
        - source/27-neural-prediction.qmd
    - part: "Generative Models and Applications"
      chapters:
        - source/30-prediction-generation.qmd
        - source/31-markov-models.qmd
        - source/32-generative-nn.qmd

bibliography: refs.bib

format:
  html:
    theme: [cosmo, custom.scss]
    css: styles.css
    toc: true
    number-depth: 0
    reference-location: margin
    callout-icon: false;
    callout-appearance: simple
    fig-cap-location: margin
    highlight-style: atom-one
    filters: 
      - scripts/remove-delims.lua

jupyter: python3

execute: 
  cache: false

profile:
  group: 
    - [preview, publish]

mermaid: 
  theme: neutral

# Enable local paths for images and data in default context (but full URL for live notebooks)
site-url: "."